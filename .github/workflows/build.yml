name: Build and test desktop packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-latest
            build: build:win
          - os: macos-latest
            build: build:mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify packaged Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QINGYE_APP = Join-Path $PWD 'release/win-unpacked/轻页文件工具箱.exe'
          node scripts/toolbox-smoke.mjs
          $env:QINGYE_PACKAGED_APP = $env:QINGYE_APP
          node --test tests/mcp.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: qingye-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
