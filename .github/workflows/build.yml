name: Build desktop packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: build:win
            artifact: release/*.exe
          - os: macos-latest
            build: build:mac
            artifact: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:ui
      - run: npm run ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: 校验打包后的 Windows 应用
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QINGYE_APP = Join-Path $PWD 'release/win-unpacked/轻页文件工具箱.exe'
          node scripts/toolbox-smoke.mjs
          $env:QINGYE_PACKAGED_APP = $env:QINGYE_APP
          node --test tests/mcp.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: qingye-desktop-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: error
      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
          fail_on_unmatched_files: true
