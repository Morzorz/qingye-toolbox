<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>轻页 PDF 压缩</title><link rel="stylesheet" href="styles.css"></head>
<body><aside><div class="brand"><span class="brandmark">↘</span><div>轻页<span>QINGYE PDF</span></div></div><div class="nav-item"><span>▤</span> PDF 压缩</div><div class="aside-bottom"><div class="local-dot"></div>文件只留在你的电脑<p>离线处理 · 无需上传</p><small>版本 1.0.0</small></div></aside>
<main><header><div><div class="eyebrow">让文件轻一点</div><h1>PDF 压缩</h1><p>保留重要内容，轻松分享每一页。</p></div><span class="badge">● 完全离线</span></header>
<section class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="添加或拖入 PDF 文件"><span class="upload-icon">＋</span><div><strong>将 PDF 拖到这里</strong><p>或点击选择文件 · 支持批量添加 · 单个文件最大 500 MB</p></div><button id="pick" class="secondary">选择文件</button></section>
<section class="settings"><div class="section-title">压缩程度 <span>根据用途，选择合适的清晰度</span></div><div class="presets" role="radiogroup" aria-label="压缩程度"><label class="preset"><input type="radio" name="preset" value="clear"><div><strong>清晰优先</strong><span>细节更丰富，适合打印</span></div></label><label class="preset selected"><input type="radio" name="preset" value="balanced" checked><div><strong>均衡 <em>推荐</em></strong><span>清晰与大小兼顾，适合合同</span></div></label><label class="preset"><input type="radio" name="preset" value="small"><div><strong>最小体积</strong><span>文件更小，适合快速传阅</span></div></label></div><div class="folder-row"><span>保存到</span><span id="folder" title="原文件所在文件夹">原文件所在文件夹</span><button id="folder-pick" class="link">更改</button><button id="folder-reset" class="link" hidden>恢复默认</button></div></section>
<section class="queue"><div class="queue-heading"><div class="section-title">文件列表 <span id="count">0 个文件</span></div><button id="clear" class="link" disabled>清空列表</button></div><div id="empty"><span>▤</span><p>添加文件后，在这里查看压缩结果</p></div><div id="files"></div></section>
<div id="message" role="status" aria-live="polite"></div>
<footer><div><strong id="summary">准备好，让文件变轻</strong><p id="hint">另存为新文件，原文件始终保留。</p></div><button id="cancel" class="secondary" hidden>取消任务</button><button id="start" class="primary" disabled>开始压缩 <span>→</span></button></footer></main><script src="renderer.js"></script></body></html>
